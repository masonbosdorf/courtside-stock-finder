<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stock Finder" />
<meta name="theme-color" content="#0c0c0c" />
<title>CourtSide · Stock Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ===== CourtSide theme tokens (shared with Sales Tracker + Fulfilment Dashboard) ===== */
:root{
  --bg:#0c0c0c;
  --bg-grad:linear-gradient(135deg,#0b0b0b 0%,#161616 55%,#0b0b0b 100%);
  --signal:#ffffff;
  --panel:#161618;
  --panel-2:#1c1c1f;
  --line:rgba(255,255,255,0.08);
  --line-2:rgba(255,255,255,0.14);
  --muted:rgba(255,255,255,0.74);
  --faint:rgba(255,255,255,0.46);
  --ghost:rgba(255,255,255,0.22);
  --up:#46e08a;
  --bad:#ff5252;
  --gold:#ffd66b;
  --chip:44px;            /* tap-target height — bumped on touch devices */
  color-scheme:dark;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg);}
body{
  min-height:100vh;background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;
  color:var(--signal);font-family:"Space Grotesk",system-ui,sans-serif;font-weight:500;font-size:15px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top);
}
.display{font-family:"Archivo Black",sans-serif;letter-spacing:-0.02em;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;}
button:focus-visible,input:focus-visible{outline:2px solid var(--up);outline-offset:2px;}
[hidden]{display:none!important;}

/* ===== device-aware layout: html[data-device] is phone | tablet | desktop ===== */
.wrap{max-width:820px;margin:0 auto;padding:0 clamp(12px,3vw,24px) 104px;}
html[data-device="tablet"] .wrap{max-width:1120px;}
html[data-device="desktop"] .wrap{max-width:1360px;}
html[data-device="tablet"]{--chip:48px;}
html[data-device="phone"]{--chip:46px;}

/* ===== header ===== */
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(14px,3vw,26px) 0 clamp(10px,2vw,16px);}
.brand{display:flex;align-items:center;gap:clamp(10px,2.4vw,18px);min-width:0;}
.brand img{width:clamp(40px,7vw,58px);height:auto;flex:0 0 auto;}
.brand .t1{font-family:"Archivo Black",sans-serif;font-size:clamp(22px,5.4vw,36px);letter-spacing:-0.02em;line-height:0.92;color:var(--faint);text-transform:uppercase;white-space:nowrap;}
.brand .t1 .scr{color:var(--signal);}
.brand .t2{font-size:clamp(9px,2vw,11px);letter-spacing:0.22em;text-transform:uppercase;color:var(--faint);margin-top:5px;}
.live{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;}
.live-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(70,224,138,0.45);color:var(--up);border-radius:999px;padding:5px 10px;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;}
.live-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);}
.live-pill.stale{color:var(--gold);border-color:rgba(255,214,107,0.5);}
.live-pill.stale .dot{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.live-pill.off{color:var(--faint);border-color:var(--line-2);}
.live-pill.off .dot{background:var(--faint);box-shadow:none;}
.live .asof{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--faint);font-variant-numeric:tabular-nums;}
.live .asof b{color:var(--muted);font-weight:600;}

/* ===== search (sticky) ===== */
.search-wrap{position:sticky;top:0;z-index:20;padding:8px 0 12px;margin:0 -4px;background:linear-gradient(var(--bg) 70%,rgba(12,12,12,0));}
.search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:16px;padding:0 8px 0 16px;height:clamp(54px,11vw,64px);transition:border-color .15s,box-shadow .15s;}
.search:focus-within{border-color:rgba(255,255,255,0.32);box-shadow:0 0 0 4px rgba(255,255,255,0.04);}
.search > svg{width:22px;height:22px;flex:0 0 auto;color:var(--faint);}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--signal);font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:clamp(17px,4.2vw,21px);letter-spacing:0.01em;outline:none;}
.search input::placeholder{color:var(--ghost);font-weight:500;}
.search input::-webkit-search-cancel-button{display:none;}
.ibtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--muted);transition:background .12s,color .12s;}
.ibtn:hover{background:rgba(255,255,255,0.08);color:var(--signal);}
.ibtn svg{width:22px;height:22px;}
.ibtn.clr{display:none;font-size:20px;line-height:1;}
.search.has .ibtn.clr{display:flex;}
.ibtn.cam{background:rgba(70,224,138,0.1);color:var(--up);border:1px solid rgba(70,224,138,0.35);}
.ibtn.cam:hover{background:rgba(70,224,138,0.18);}
html[data-device="desktop"] .ibtn.cam{display:none;}
.search-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 6px 0;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);}
.search-meta b{color:var(--muted);font-weight:700;}
.search-meta .mode{color:var(--gold);}
.search-meta kbd{font:inherit;border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;color:var(--muted);}
html[data-device="phone"] .search-meta #hint{display:none;}

/* ===== results ===== */
.results{display:grid;grid-template-columns:1fr;gap:12px;align-items:start;}
html[data-device="tablet"] .results,html[data-device="desktop"] .results{grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px;}
.results > .empty,.results > .more,.results > .loading,.results > .card.flat{grid-column:1/-1;}
html[data-device="phone"] .card.flat .whcol{display:none;}
.card.flat td.prod{min-width:0;} .card.flat td.prod .nm{font-size:14px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0;}
.card.hit{border-color:rgba(70,224,138,0.45);box-shadow:0 0 0 1px rgba(70,224,138,0.15);}
.card-h{display:flex;align-items:flex-start;gap:14px;padding:clamp(14px,3vw,18px) clamp(14px,3vw,20px) 12px;}
.card-h .who{min-width:0;flex:1 1 auto;}
.eyebrow{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--faint);font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.eyebrow .code{color:var(--muted);letter-spacing:0.08em;font-variant-numeric:tabular-nums;}
.card-h h2{font-size:clamp(16px,4vw,20px);font-weight:700;letter-spacing:-0.005em;line-height:1.15;margin-top:6px;text-wrap:balance;}
.tot{display:flex;gap:clamp(12px,3vw,22px);flex:0 0 auto;text-align:right;}
.tot .v{font-family:"Archivo Black",sans-serif;font-size:clamp(22px,5.6vw,30px);line-height:0.95;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;}
.tot .l{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--faint);margin-top:5px;font-weight:700;}
.tot .zero .v{color:var(--ghost);}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
thead th{font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--faint);font-weight:700;text-align:left;padding:8px clamp(14px,3vw,20px) 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,255,255,0.02);}
thead th.n,td.n{text-align:right;}
tbody td{padding:9px clamp(14px,3vw,20px);border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tbody tr.hl td{background:rgba(70,224,138,0.08);}
tbody tr.hl td.size{color:var(--up);}
td.size{font-weight:700;font-size:15px;white-space:nowrap;width:1%;}
td.size .eu{font-size:10px;letter-spacing:0.1em;color:var(--gold);font-weight:700;margin-top:2px;}
td.bins{color:var(--muted);}
.stack{display:flex;flex-wrap:wrap;gap:6px;}
.bin{display:inline-flex;align-items:center;gap:8px;min-height:calc(var(--chip) - 12px);font-family:"Archivo Black",sans-serif;font-size:14px;letter-spacing:0.02em;color:var(--signal);background:rgba(255,255,255,0.06);border:1px solid var(--line);border-radius:8px;padding:5px 10px;line-height:1;transition:background .12s,border-color .12s;}
.bin:hover{background:rgba(255,255,255,0.11);border-color:var(--line-2);}
.bin .q{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:12px;color:var(--up);}
.none{color:var(--ghost);font-weight:600;}
td.qty{font-family:"Archivo Black",sans-serif;font-size:18px;letter-spacing:-0.02em;white-space:nowrap;width:1%;line-height:1.1;}
td.qty.ok{color:var(--up);}
td.qty.zero{color:var(--ghost);}
td.floor{font-weight:700;font-size:15px;color:var(--muted);white-space:nowrap;width:1%;}
td.floor.zero{color:var(--ghost);}

.th{flex:0 0 auto;width:var(--th);height:var(--th);border-radius:10px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);}
.th img{width:100%;height:100%;object-fit:contain;display:block;}
.th.none{background:var(--panel-2);}
.th.none img{display:none;}
.th.none::after{content:"";width:38%;height:38%;border:2px dashed var(--ghost);border-radius:6px;}
:root{--th:52px;}
html[data-device="tablet"]{--th:64px;} html[data-device="desktop"]{--th:64px;}
.th.sm{--th:38px;border-radius:8px;}
td.prod{display:flex;align-items:center;gap:10px;}
td.prod .pt{min-width:0;}
.price{margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
.price .now{font-family:"Archivo Black",sans-serif;font-size:clamp(16px,4vw,20px);letter-spacing:-0.02em;color:var(--signal);}
.price.sale .now{color:var(--gold);}
.price s{color:var(--faint);font-weight:600;font-size:13px;}
.price .off{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(255,214,107,0.45);border-radius:6px;padding:2px 6px;}
.price .np{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--ghost);}
.price .mixed{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);font-weight:700;}
td.rp{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;width:1%;}
td.rp.sale{color:var(--gold);} td.rp s{color:var(--faint);font-weight:500;font-size:12px;margin-left:5px;} td.rp .off{color:var(--gold);font-size:10px;margin-left:5px;letter-spacing:0.08em;}
td.rp.np{color:var(--ghost);font-weight:600;font-size:12px;}
.sk .pr{color:var(--muted);font-weight:700;} .sk .pr.sale{color:var(--gold);} .sk .pr s{color:var(--faint);font-weight:500;} .sk .pr .off{color:var(--gold);}
/* bin-mode card: one bin, many products */
.card.binview .card-h h2{font-family:"Archivo Black",sans-serif;font-size:clamp(24px,6vw,34px);letter-spacing:-0.02em;}
td.prod{min-width:0;}
td.prod .nm{font-weight:700;}
td.prod .sk{font-size:12px;color:var(--faint);margin-top:2px;letter-spacing:0.04em;}

.empty,.loading{text-align:center;padding:56px 20px;color:var(--faint);}
.empty .big{font-family:"Archivo Black",sans-serif;font-size:clamp(22px,5vw,30px);color:var(--muted);letter-spacing:-0.02em;margin-bottom:10px;text-wrap:balance;}
.empty p{max-width:36ch;margin:0 auto;line-height:1.5;font-size:14px;}
.empty p b{color:var(--muted);}
.empty .cta{margin-top:18px;display:inline-flex;align-items:center;gap:8px;background:rgba(70,224,138,0.1);border:1px solid rgba(70,224,138,0.35);color:var(--up);border-radius:12px;padding:12px 18px;font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;}
.empty .cta svg{width:18px;height:18px;}
html[data-device="desktop"] .empty .cta{display:none;}
.more{margin:4px auto 0;display:block;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 22px;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;}
.more:hover{color:var(--signal);border-color:var(--line-2);}

/* ===== footer ===== */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,12,12,0.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.foot-in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(12px,3vw,24px);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--faint);}
html[data-device="tablet"] .foot-in{max-width:1120px;}
html[data-device="desktop"] .foot-in{max-width:1360px;}
.foot-in b{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;}
.foot-in .lockbtn{color:var(--faint);letter-spacing:0.16em;text-transform:uppercase;font-size:10px;font-weight:700;}
.foot-in .lockbtn:hover{color:var(--signal);}
html[data-device="phone"] .foot-in .mid{display:none;}
@media (max-width:520px){.brand .t2{display:none;} .tot{gap:14px;}}

/* ===== lock screen (POS-style keypad, same pattern as SWISH) ===== */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);background-image:var(--bg-grad);display:flex;align-items:center;justify-content:center;padding:24px;}
.lock-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:26px;}
.lock-in img{width:72px;height:auto;}
.lock-t{text-align:center;}
.lock-t .t1{font-family:"Archivo Black",sans-serif;font-size:30px;letter-spacing:-0.02em;line-height:0.95;color:var(--faint);text-transform:uppercase;}
.lock-t .t1 .scr{color:var(--signal);}
.lock-t .t2{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--faint);margin-top:10px;font-weight:700;}
.pips{display:flex;gap:14px;}
.pip{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.28);transition:background .1s,border-color .1s;}
.pip.on{background:var(--signal);border-color:var(--signal);}
.pips.err .pip{border-color:var(--bad);}
.pips.err .pip.on{background:var(--bad);}
.lock-msg{height:18px;margin-top:-10px;font-size:12px;font-weight:700;color:var(--bad);}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;}
.key{height:70px;border-radius:18px;font-family:"Archivo Black",sans-serif;font-size:24px;color:var(--signal);background:var(--panel);border:1px solid var(--line);transition:transform .07s,background .07s;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;}
.key:active{background:var(--panel-2);transform:scale(0.97);}
.key.back{color:var(--muted);}
.key.back svg{width:26px;height:26px;}
.lock-foot{font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ghost);text-align:center;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .42s ease-in-out;}

/* ===== camera scanner overlay ===== */
.scan{position:fixed;inset:0;z-index:90;background:#000;display:flex;flex-direction:column;}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.scan .shade{position:absolute;inset:0;background:radial-gradient(ellipse 62% 30% at 50% 44%,transparent 60%,rgba(0,0,0,0.62) 100%);pointer-events:none;}
.scan .frame{position:absolute;left:50%;top:44%;width:min(78vw,520px);height:min(34vw,220px);transform:translate(-50%,-50%);border-radius:14px;pointer-events:none;}
.scan .frame::before,.scan .frame::after,.scan .frame i::before,.scan .frame i::after{content:"";position:absolute;width:28px;height:28px;border:3px solid var(--up);border-radius:6px;}
.scan .frame::before{left:-2px;top:-2px;border-right:0;border-bottom:0;}
.scan .frame::after{right:-2px;top:-2px;border-left:0;border-bottom:0;}
.scan .frame i::before{left:-2px;bottom:-2px;border-right:0;border-top:0;}
.scan .frame i::after{right:-2px;bottom:-2px;border-left:0;border-top:0;}
.scan .laser{position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--up);box-shadow:0 0 10px var(--up);opacity:0.8;animation:laser 1.6s ease-in-out infinite;}
@keyframes laser{0%,100%{transform:translateY(-40px)}50%{transform:translateY(40px)}}
.scan .top{position:relative;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;}
.scan .top .t{font-family:"Archivo Black",sans-serif;font-size:18px;letter-spacing:-0.01em;}
.scan .x{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.14);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;}
.scan .status{position:absolute;left:0;right:0;top:calc(44% + min(17vw,110px) + 22px);text-align:center;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.8);font-weight:700;padding:0 20px;}
.scan .status.bad{color:var(--bad);}
.scan .status .last{display:block;margin-top:8px;color:var(--up);font-family:"Archivo Black",sans-serif;font-size:20px;letter-spacing:0.04em;text-transform:none;}
.scan .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;padding:0 20px calc(28px + env(safe-area-inset-bottom));}
.scan .ctl button{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<!-- ===== LOCK ===== -->
<div id="lock" class="lock">
  <div class="lock-in">
    <img id="lock-logo" alt="CourtSide" />
    <div class="lock-t">
      <div class="t1">Stock <span class="scr">Finder</span></div>
      <div class="t2">Enter your code</div>
    </div>
    <div class="pips" id="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
    <div class="lock-msg" id="lock-msg"></div>
    <div class="pad" id="pad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <span></span><button class="key" data-k="0">0</button>
      <button class="key back" data-k="back" aria-label="Delete last digit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m18 9-6 6M12 9l6 6"/></svg></button>
    </div>
    <div class="lock-foot">Authorised staff only · CourtSide Melbourne</div>
  </div>
</div>

<!-- ===== APP ===== -->
<div class="wrap" id="app" hidden>
  <header class="head">
    <div class="brand">
      <img id="app-logo" alt="CourtSide" />
      <div>
        <div class="t1">Stock <span class="scr">Finder</span></div>
        <div class="t2">CourtSide Melbourne · Warehouse bins</div>
      </div>
    </div>
    <div class="live">
      <span class="live-pill off" id="pill"><span class="dot"></span><span id="pill-t">Loading</span></span>
      <span class="asof">Updated <b id="asof">—</b></span>
    </div>
  </header>

function device() {

  const phone = /iPhone|iPod|Android.*Mobile/.test(ua) || (coarse && !iPad && Math.min(innerWidth, innerHeight) < 600);
  return phone ? 'phone' : (iPad || coarse || /Android/.test(ua)) ? 'tablet' : 'desktop';
}

    const rp = p.pricing.mixed ? `<td class="n rp ${s.price == null ? 'np' : s.cmp ? 'sale' : ''}">${s.price == null ? '—' : money(s.price)}${s.cmp ? `<s>${money(s.cmp)}</s><span class="off">−${pct(s.price, s.cmp)}%</span>` : ''}</td>` : '';
    return `<tr class="${hit && s.sku === hit ? 'hl' : ''}"><td class="size">${esc(s.size)}</td><td class="bins">${bins}</td>${rp}<td class="n qty ${s.wh ? 'ok' : 'zero'}">${s.wh || '—'}</td><td class="n floor ${s.floor ? '' : 'zero'}">${s.floor || '—'}</td></tr>`;
  }).join('');
  const rph = p.pricing.mixed ? '<th class="n">Price</th>' : '';
  return `<section class="card${hit ? ' hit' : ''}">
    <div class="card-h">${thumb(p.parent)}<div class="who">
      <div class="eyebrow"><span>${esc(p.brand || '—')}</span><span class="code">${esc(p.parent)}</span></div>
      <h2>${esc(nice(p.name) || p.parent)}</h2>
      ${priceHTML(p.pricing)}
    </div>
    <div class="tot"><div class="${p.wh ? '' : 'zero'}"><div class="v">${p.wh}</div><div class="l">Warehouse</div></div><div class="${p.floor ? '' : 'zero'}"><div class="v">${p.floor}</div><div class="l">Floor</div></div></div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Size</th><th>Bin · avail</th>${rph}<th class="n">Warehouse</th><th class="n">Floor</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}
function binCard(b) {
  const rows = b.rows.sort((x, y) => x.p.name.localeCompare(y.p.name) || cmpSize(x.s.size, y.s.size)).map(({ p, s, av }) =>
    `<tr><td class="prod">${thumb(p.parent, true)}<div class="pt"><div class="nm">${esc(nice(p.name) || p.parent)}</div><div class="sk">${esc(p.brand || '—')} · ${esc(s.sku)} · ${rowPrice(s.price, s.cmp)}</div></div></td><td class="size">${esc(s.size)}</td><td class="n qty ok">${av}</td></tr>`).join('');
  return `<section class="card binview">
    <div class="card-h"><div class="who"><div class="eyebrow"><span>Bin</span><span class="code">${b.rows.length} SKU${b.rows.length === 1 ? '' : 's'}</span></div><h2>${esc(b.bin)}</h2></div>
    <div class="tot"><div><div class="v">${b.units}</div><div class="l">Units avail</div></div></div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Product</th><th>Size</th><th class="n">Avail</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}
function flatCard(r) {
  const label = r.brands.length ? r.brands.join(' · ') : `“${r.left}”`;
  const wh = r.rows.reduce((a, it) => a + it[6].reduce((x, b) => x + b[1], 0), 0), fl = r.rows.reduce((a, it) => a + it[5], 0);
  const rows = r.rows.slice(0, LIMIT).map(it => {
    const [sku, name, brand, bc, parent, floor, bins] = it, w = bins.reduce((a, b) => a + b[1], 0);
    const chips = bins.length ? `<div class="stack">${bins.map(b => binChip(b[0], b[1])).join('')}</div>` : `<span class="none">—</span>`;
    const eu = r.euBySku && r.euBySku[sku];
    return `<tr><td class="prod">${thumb(parent, true)}<div class="pt"><div class="nm">${esc(nice(name) || parent)}</div><div class="sk">${esc(sku)}${r.brands.length > 1 ? ' · ' + esc(brand) : ''} · ${rowPrice(it[7] ?? null, it[8] || 0)}</div></div></td><td class="size">${esc(sizeOf(sku, parent))}${eu ? `<div class="eu">${esc(eu)}</div>` : ''}</td><td class="bins">${chips}</td><td class="n qty whcol ${w ? 'ok' : 'zero'}">${w || '—'}</td><td class="n floor ${floor ? '' : 'zero'}">${floor || '—'}</td></tr>`;
  }).join('');
  return `<section class="card flat">
    <div class="card-h"><div class="who"><div class="eyebrow"><span>${esc(label)}</span><span class="code">${r.rows.length} SKU${r.rows.length === 1 ? '' : 's'}</span></div><h2>Size ${esc(r.sizes.join(' / '))}</h2></div>
    <div class="tot"><div class="${wh ? '' : 'zero'}"><div class="v">${wh}</div><div class="l">Warehouse</div></div><div class="${fl ? '' : 'zero'}"><div class="v">${fl}</div><div class="l">Floor</div></div></div></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Product</th><th>Size</th><th>Bin · avail</th><th class="n whcol">Warehouse</th><th class="n">Floor</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}
function render() {
  if (!S) return;
  const q = $('q').value; $('searchbox').classList.toggle('has', !!q);
  const r = search(q), out = $('results'), meta = $('meta');
  if (r.mode === 'flat' && LIMIT < 60) LIMIT = 60;
  if (r.mode === 'idle') {
    meta.textContent = 'Type or scan to search';
    out.innerHTML = `<div class="empty"><div class="big">Where is it?</div><p>Search a style code like <b>HF2881</b>, a size like <b>HF2881-303 10</b>, a product name, a bin like <b>A-041</b>, or a brand with sizes or a kind: <b>Nike - 7, 8</b>, <b>Jordan - hat or cap</b>, <b>Adidas - womens shorts M</b>. EU or the other scale work too: <b>Kobe 8 - 44</b>, <b>Sabrina 4 - m10</b>.</p><button class="cta" id="cta-scan">${CAM_SVG}Scan a barcode</button></div>`;
    return;
  }
  if (r.mode === 'flat') {
    const who = r.brands.length ? r.brands.join(', ') : `“${esc(r.left)}”`;
    if (r.needSizes) {
      meta.innerHTML = `<span class="mode">Brand · filter</span> · add sizes or a kind after the dash`;
      out.innerHTML = `<div class="empty"><div class="big">${who} — which sizes or kind?</div><p>Finish with sizes: <b>${esc(r.left)} - 7, 8</b> · or a kind of item: <b>${esc(r.left)} - socks</b>, <b>${esc(r.left)} - hat or cap</b> · or both: <b>${esc(r.left)} - womens shorts M</b>.</p></div>`;
      return;
    }
    const kindTxt = r.kinds && r.kinds.length ? ' · ' + esc(r.kinds.map(g => g.join(' ')).join(' or ')) : '';
    const G = { m: 'mens', w: 'womens', k: 'kids' };
    const euTxt = r.conv && r.conv.length ? ' · <span class="mode">' + r.conv.map(c => `${c.from} → US ${c.us} ${G[c.g]}`).join(' · ') + '</span>' : '';
    meta.innerHTML = `<span class="mode">Brand · size</span> · <b>${who}</b>${kindTxt} · ${esc(r.sizes.join(', '))}${euTxt} · <b>${r.rows.length}</b> SKUs`;
    if (!r.rows.length) { const euQ = r.sizes.map(isEU).filter(Boolean); out.innerHTML = `<div class="empty"><div class="big">Nothing in ${esc(r.sizes.join(' / '))} for ${who}</div><p>${euQ.length ? `EU ${euQ.join(' / ')} is converted per shoe (mens, womens or kids US sizing) — nothing in stock matched. Try the neighbouring half size.` : r.brands.length ? 'No SKUs of that brand in those sizes have stock available.' : `No brand called “${esc(r.left)}” — check the spelling, or it's matching product names instead.`}</p></div>`; return; }
    out.innerHTML = flatCard(r) + (r.rows.length > LIMIT ? `<button class="more" id="more" data-step="60">Show ${Math.min(60, r.rows.length - LIMIT)} more of ${r.rows.length}</button>` : '');
    return;
  }
  if (r.mode === 'bin') {
    meta.innerHTML = `<span class="mode">Bin view</span> · <b>${r.bins.length}</b> bin${r.bins.length === 1 ? '' : 's'}`;
    out.innerHTML = r.bins.slice(0, LIMIT).map(binCard).join('') + (r.bins.length > LIMIT ? `<button class="more" id="more">Show ${Math.min(20, r.bins.length - LIMIT)} more</button>` : '');
    return;
  }
  if (r.nobc) {
    meta.textContent = 'No match';
    out.innerHTML = `<div class="empty"><div class="big">Barcode ${esc(r.nobc)} isn't in stock</div><p>Nothing available for it in the warehouse bins or on the floor, or NetSuite has no item with that barcode. Try the style code printed on the tag.</p><button class="cta" id="cta-scan">${CAM_SVG}Scan again</button></div>`;
    return;
  }
  const n = r.styles.length, skus = r.styles.reduce((a, p) => a + p.sizes.length, 0);
  const kindLbl = r.kind ? `<span class="mode">${esc(r.kind.brands.length ? r.kind.brands.join(', ') : r.kind.left)} · ${esc(r.kind.kinds.map(g => g.join(' ')).join(' or '))}</span> · ` : '';
  meta.innerHTML = n ? `${kindLbl}<b>${n}</b> style${n === 1 ? '' : 's'} · <b>${skus}</b> SKUs${r.hit ? ` · <span class="mode">scanned ${esc(r.hit)}</span>` : ''}` : 'No match';
  if (!n) { out.innerHTML = `<div class="empty"><div class="big">Nothing found for “${esc(q)}”</div><p>${r.kind ? 'No in-stock items of that kind for that brand. Try a broader word — <b>hat</b>, <b>socks</b>, <b>bag</b>, <b>shoes</b>, <b>tee</b>, <b>shorts</b> — or drop the size.' : 'Check the style code, or try fewer words. Items with nothing available in the warehouse or on the floor don\'t appear here.'}</p></div>`; return; }
  out.innerHTML = r.styles.slice(0, LIMIT).map(p => styleCard(p, r.hit)).join('') + (n > LIMIT ? `<button class="more" id="more">Show ${Math.min(20, n - LIMIT)} more of ${n}</button>` : '');
  if (r.hit) { const row = out.querySelector('tr.hl'); if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

/* ---------- wire up ---------- */
const input = $('q');
let t; input.addEventListener('input', () => { LIMIT = 20; clearTimeout(t); t = setTimeout(render, 60); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); render(); } });
$('clr').addEventListener('click', () => { input.value = ''; LIMIT = 20; render(); input.focus(); });
$('results').addEventListener('click', e => {
  const b = e.target.closest('.bin'); if (b) { input.value = b.dataset.bin; LIMIT = 20; render(); scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (e.target.id === 'more') { LIMIT += Number(e.target.dataset.step || 20); render(); return; }
  if (e.target.closest('#cta-scan')) openScanner();
});
addEventListener('keydown', e => { if (e.key === '/' && $('lock').hidden && document.activeElement !== input && $('scan').hidden) { e.preventDefault(); input.focus(); input.select(); } });

/* ---------- seed loading + live refresh ----------
   stock-seed.json (~1 MB raw, ~160 KB gzipped) is fetched the moment the page opens — while the
   code is still being typed — and cached in localStorage. Repeat opens render from the cache
   instantly, then stock-meta.json (150 bytes, never cached) says whether a newer seed exists;
   only then is the seed re-fetched, keyed by its asOf so the browser cache can hold it. */
const CACHE_KEY = 'sf_seed';
let booted = false, inflight = null;
function applySeed(seed) { window.STOCK_SEED = seed; buildIndex(); render(); }
function readCache() { try { const t = localStorage.getItem(CACHE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function writeCache(text) { try { localStorage.setItem(CACHE_KEY, text); } catch (e) { /* quota — fine, we just refetch next time */ } }
async function fetchJSON(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(url + ' ' + r.status); return r; }
function refresh() {
  if (inflight) return inflight;
  inflight = (async () => {
    const m = await (await fetchJSON('stock-meta.json?v=' + Date.now(), { cache: 'no-store' })).json();
    if (S && m.asOf === S.asOf) return false;
    const r = await fetchJSON('stock-seed.json?v=' + encodeURIComponent(m.asOf));
    const text = await r.text(), seed = JSON.parse(text);
    writeCache(text); applySeed(seed); return true;
  })().finally(() => { inflight = null; });
  return inflight;
}
async function boot() {
  if (booted) return; booted = true;
  if (!S) { const c = window.STOCK_SEED || readCache(); if (c) applySeed(c); }
  try { await refresh(); }
  catch (e) { if (!S) { $('pill').className = 'live-pill off'; $('pill-t').textContent = 'Offline'; $('results').innerHTML = `<div class="empty"><div class="big">Couldn't load stock data</div><p>Check the connection, then pull down to refresh.</p></div>`; } }
  setInterval(() => refresh().catch(() => {}), 60000);
}
// start the download immediately — before the code is entered — unless data was inlined
if (!window.STOCK_SEED) refresh().catch(() => {});

/* ---------- camera barcode scanner ----------
   One code path, the BarcodeDetector API. iPhone/iPad Safari has NO native BarcodeDetector
   (only the Camera app can read codes), and Chrome-on-Mac's is unreliable, so everywhere except
   Android Chrome we use the vendored ponyfill (barcode-detector 3.2.2 → zxing-wasm 3.1.3, the C++
   ZXing compiled to WebAssembly — fast and solid on 1D codes). Tags are Code 128 (SKU) or
   EAN-13 / UPC-A (product barcode); both resolve to a style card. */
const FORMATS = ['code_128', 'ean_13', 'upc_a', 'ean_8', 'upc_e', 'code_39', 'itf', 'qr_code'];
let scanning = false, facing = 'environment', tickTimer = null, stream = null, lastHit = '', Detector = null, torchOn = false;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s); }); }
async function getDetector() {
  if (Detector) return Detector;
  if ('BarcodeDetector' in window && /Android/.test(navigator.userAgent)) {
    try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('code_128') && f.includes('ean_13')) return (Detector = window.BarcodeDetector); } catch (e) {}
  }
  await loadScript('vendor/barcode-detector.min.js');
  BarcodeDetectionAPI.prepareZXingModule({ overrides: { locateFile: (p, prefix) => p.endsWith('.wasm') ? 'vendor/zxing_reader.wasm' : prefix + p }, fireImmediately: true });
  return (Detector = BarcodeDetectionAPI.BarcodeDetector);
}
function setStatus(t, bad) { const s = $('scan-status'); s.className = 'status' + (bad ? ' bad' : ''); s.innerHTML = t; }
async function openScanner() {
  if (scanning) return; scanning = true; lastHit = ''; torchOn = false;
  $('scan').hidden = false; $('scan-torch').hidden = true; setStatus('Starting camera…');
  try {
    const D = await getDetector();
    const det = new D({ formats: FORMATS });
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    const v = $('video'); v.srcObject = stream; await v.play();
    try { const cap = stream.getVideoTracks()[0].getCapabilities && stream.getVideoTracks()[0].getCapabilities(); if (cap && cap.torch) $('scan-torch').hidden = false; } catch (e) {}
    setStatus('Line the barcode up in the box');
    const tick = async () => {
      if (!scanning) return;
      const t0 = Date.now();
      try { if (v.readyState >= 2) { const codes = await det.detect(v); if (codes.length && scanning) onBarcode(codes[0].rawValue); } } catch (e) {}
      tickTimer = setTimeout(tick, Math.max(40, 140 - (Date.now() - t0)));
    };
    tick();
  } catch (e) {
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    setStatus(denied ? 'Camera access was blocked — allow it in Settings › Safari › Camera, then try again'
                     : (e && e.name === 'NotFoundError') ? 'No camera found on this device' : 'Couldn\'t start the camera', true);
  }
}
function closeScanner() {
  scanning = false; $('scan').hidden = true;
  if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }
  if (stream) { stream.getTracks().forEach(tr => tr.stop()); stream = null; }
  $('video').srcObject = null;
}
function onBarcode(text) {
  const c = String(text).trim(); if (!c || c === lastHit) return; lastHit = c;
  if (navigator.vibrate) navigator.vibrate(40);
  const byBc = /^\d{8,14}$/.test(c) ? findBarcode(c) : null;
  const it = byBc || findSku(c);
  setStatus((it ? 'Found' : 'Not in stock') + `<span class="last">${esc(c)}</span>`, !it);
  setTimeout(() => { closeScanner(); input.value = it ? (byBc ? c : it[0]) : c; LIMIT = 20; render(); }, it ? 300 : 900);
}
$('cam').addEventListener('click', openScanner);
$('scan-x').addEventListener('click', closeScanner);
$('scan-flip').addEventListener('click', () => { facing = facing === 'environment' ? 'user' : 'environment'; closeScanner(); openScanner(); });
$('scan-torch').addEventListener('click', async () => { try { torchOn = !torchOn; await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] }); $('scan-torch').textContent = torchOn ? 'Torch off' : 'Torch'; } catch (e) {} });
addEventListener('keydown', e => { if (e.key === 'Escape' && scanning) closeScanner(); });
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) $('cam').hidden = true;
// warm the decoder on touch devices so the first scan starts instantly (1 MB wasm, cached after)
else if (document.documentElement.dataset.device !== 'desktop') setTimeout(() => { getDetector().catch(() => {}); }, 4000);
</script>
</body>
</html>
